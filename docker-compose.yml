# درگاه پرداخت گروه جهادی بسیج — ارکستراسیون خود-میزبانی
# ---
# Basij payment portal — self-hosting orchestration

services:
  web:
    build:
      context: .
      args:
        SITE_ORIGIN: ${SITE_ORIGIN:?Set SITE_ORIGIN in .env before building.}
    image: basij-tamin:latest
    container_name: basij-tamin
    ports:
      - "8080:8080"
    restart: unless-stopped
