name: Lint

on:
  push:
    branches: [ "7.0" ]
  pull_request:
    branches: [ "7.0" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx eslint . --ext .js