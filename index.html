<!doctype html>
<html lang="fa" dir="rtl" data-version="7.0.0">
<head>
  <!-- Version 7.0.0 -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3a22">
  <meta name="version" content="7.0.0">
  <meta name="description" content="درگاه پرداخت آنلاین گروه جهادی بسیج شهدای سازمان تأمین اجتماعی - کمک به نیازمندان، نذورات شرعی و امور خیریه">
  <meta name="author" content="گروه جهادی بسیج سازمان تأمین اجتماعی">
  <meta name="keywords" content="پرداخت آنلاین, بسیج, تأمین اجتماعی, نذر, صدقه, خیریه, کمک معیشتی">
  <meta property="og:title" content="درگاه پرداخت گروه جهادی بسیج">
  <meta property="og:description" content="پرداخت آنلاین به نیات خیر - بسیج سازمان تأمین اجتماعی">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:site_name" content="درگاه پرداخت گروه جهادی بسیج">
  <meta property="og:image" content="__SITE_ORIGIN__/images/logo/cards-page-title-desktop.webp">
  <meta property="og:url" content="__SITE_ORIGIN__/">
  <link rel="canonical" href="__SITE_ORIGIN__/">
  <link rel="icon" href="images/logo/icon.webp" type="image/webp">
  <!-- Preconnect for third-party analytics origin to reduce handshake latency -->
  <link rel="preconnect" href="https://www.clarity.ms" crossorigin>
  <!-- No-JS fallback: redirect to the main content page immediately -->
  <noscript><meta http-equiv="refresh" content="0; url=cards-form.html"></noscript>
  <title>درگاه پرداخت گروه جهادی بسیج شهدای سازمان تامین اجتماعی</title>

  <!-- dotLottie player (خود-میزبان؛ کل محتوای dist در assets/vendor/ باشد) -->
  <!-- کارکرد: تلاش برای بارگذاری پلیر از روی دارایی‌های محلی پروژه -->
  <script type="module" src="assets/vendor/dotlottie-player.mjs"></script>

  <!-- فالبک: اگر مؤلفه ثبت نشد، از CDN بارگذاری شود (بدون تغییر در منطق فعلی) -->
  <!-- کارکرد: تضمین موجودبودن مؤلفه dotlottie-player حتی در صورت نبود فایل محلی -->
  <script type="module">
    (async () => {
      try {
        if (!customElements.get('dotlottie-player')) {
          await import('./assets/vendor/dotlottie-player.mjs');
        }
      } catch (e) {}
      if (!customElements.get('dotlottie-player')) {
        const s = document.createElement('script');
        s.type = 'module';
        // Pinned version + SRI to block upstream supply-chain tampering
        s.src = 'https://cdn.jsdelivr.net/npm/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs';
        s.integrity = 'sha384-ypAFdIpmPhrhuVLN9fmIZaqZHGUVSzHiiplL/kPO2+gJ4Na4yRVbVt0YhyvWdbwn';
        s.crossOrigin = 'anonymous';
        document.head.appendChild(s);
      }
    })();
  </script>

  <!-- فونت وزیر (لوکال از دایرکتوری پروژه) -->
  <!-- کارکرد: استفاده از فایل مشترک فونت‌ها -->
  <link rel="stylesheet" href="src/css/fonts.css">

  <!-- استایل‌های صفحه (حفظ ساختار و منطق فعلی؛ فقط تغییر در فونت) -->
  <!-- کارکرد: لایه‌بندی، پس‌زمینه، نوار شیشه‌ای، نسخه و فوتر -->
  <style>
    :root{
      --bg:#0b3a22; --bg2:#0f4a2a; --fg:#e9fff0; --muted:#bfe9cf; --ink:#0b3a22;
      --footer-space: 44px; --gap: 14px;

      /* اندازه‌های واکنش‌گرا */
      --anim-min: 140px; --anim-fluid: 20vmin; --anim-max: 200px;
      --bar-w-min: 260px; --bar-w-fluid: 50vw; --bar-w-max: 520px;
      --bar-h: 46px;

      /* کنترل انیمیشن */
      --p: 0%;
      --shine-w: clamp(14px, 9vw, 54px);
      --shine-alpha: .50;
      --cap-w: clamp(10px, 6vw, 36px);
      --cap-alpha: .65;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      color:var(--fg);
      background:
        radial-gradient(1200px 800px at 20% -10%, #0a2f1c 0%, transparent 60%),
        radial-gradient(900px 700px at 120% 120%, #0c3f24 0%, transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      /* تغییر اصلی: تقدم Vazirmatn برای اعمال فونت لوکال فقط در این صفحه */
      font-family:'Vazirmatn', system-ui, -apple-system, Segoe UI, Roboto, Tahoma, sans-serif;
    }

    /* صفحه تک‌نما: عنوان بالا، لودینگ وسط؛ فوتر ثابت پایین */
    .page{
      min-height:100vh;
      display:grid;
      grid-template-rows:auto 1fr;     /* نسخه داخل سکشن لودینگ است */
      align-items:start;
      justify-items:center;
      row-gap:var(--gap);
      padding:16px 16px var(--footer-space);  /* رزرو فضا برای فوتر ثابت */
    }

    /* عنوان تصویری */
    header.top{ width:100%; display:flex; justify-content:center; }
    .title-banner{
      width: clamp(220px, 24vw, 380px);
      height:auto; display:block; object-fit:contain;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,.22));
    }

    /* لودینگ */
    .loader{
      place-self:center;
      display:grid;
      place-items:center;
      gap:14px;
      width:100%;
    }
    #loaderAnim{
      width: clamp(var(--anim-min), var(--anim-fluid), var(--anim-max));
      height: clamp(var(--anim-min), var(--anim-fluid), var(--anim-max));
      display:block;
      margin:auto;
    }

    /* نوار شیشه‌ای */
    .glass-bar{
      position:relative;
      width: clamp(var(--bar-w-min), var(--bar-w-fluid), var(--bar-w-max));
      height: var(--bar-h);
      border-radius: 12px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)) border-box,
        linear-gradient(90deg, rgba(255,255,255,.10), rgba(255,255,255,.06)) padding-box;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10),
        inset 0 -8px 18px rgba(0,0,0,.10),
        0 6px 22px rgba(0,0,0,.18);
      overflow:hidden;
      display:grid;
      place-items:center;
    }

    .glass-bar .text{
      position: relative;
      z-index: 3;
      color: var(--ink);
      font-weight: 600;
      letter-spacing: 0.2px;
      font-size: clamp(13px, 1.9vmin, 16px);
      text-align: center;
      padding: 0 14px;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
      white-space: nowrap;
    }

    /* پیشروی: با متغیر --p کنترل می‌شود */
    .glass-bar .fill{
      position:absolute; top:0; bottom:0; left:0;
      width: var(--p);
      background: linear-gradient(90deg, rgba(64,199,120,.35) 0%, rgba(64,199,120,.55) 50%, rgba(64,199,120,.35) 100%);
      box-shadow: inset 0 0 0 1px rgba(64,199,120,.28), 0 2px 18px rgba(64,199,120,.28);
      z-index:1;
      will-change: width;
    }
    /* کلاهک نوری در لبهٔ پیشروی */
    .glass-bar .fill::after{
      content:"";
      position:absolute; top:0; bottom:0; right:-1px;
      width: var(--cap-w);
      background: linear-gradient(90deg,
                  rgba(255,255,255,0) 0%,
                  rgba(255,255,255,var(--cap-alpha)) 55%,
                  rgba(255,255,255,0) 100%);
      filter: blur(.4px);
      mix-blend-mode: screen;
      opacity:.9;
      pointer-events:none;
    }

    /* خط نوری اصلی */
    .glass-bar .shine{
      position:absolute; top:0; height:100%;
      left: calc(var(--p) - (var(--shine-w) / 2));
      width: var(--shine-w);
      z-index:2;
      pointer-events:none;
      mix-blend-mode: screen;
      opacity: .85;
      background: linear-gradient(90deg,
                  rgba(255,255,255,0) 0%,
                  rgba(255,255,255,var(--shine-alpha)) 48%,
                  rgba(255,255,255,0) 100%);
      filter: blur(.2px);
      will-change: left;
    }

    /* نسخه (اکنون داخل سکشن لودینگ است) */
    .version{
      font-size:13px;
      color:var(--muted);
      letter-spacing:.3px;
      text-align:center;
      margin-top: 6px;  /* فاصله از نوار */
    }

    /* کپی‌رایت ثابت پایین */
    .credits{
      position:fixed; left:0; right:0; bottom:8px;
      display:flex; justify-content:center; pointer-events:none;
      font-size:12px; color:var(--muted); text-shadow:0 1px 0 rgba(0,0,0,.25);
    }
    .credits-inner{ position:relative; min-height:1.5em; display:flex; align-items:center; justify-content:center; }
    .credit{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      opacity:0; transform:translateY(6px); filter:blur(2px);
      transition:opacity .7s ease, transform .7s ease, filter .7s ease;
      white-space:nowrap; text-align:center;
    }
    .credit.show{ opacity:1; transform:none; filter:none; }
    .credit-en{ direction:ltr; } .credit-fa{ direction:rtl; }

    /* دکمه ردشدن از لودینگ */
    .skip-loader{
      margin-top:10px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.25);
      color:var(--fg);
      font:inherit; font-size:14px; font-weight:600;
      padding:10px 22px;
      border-radius:999px;
      cursor:pointer;
      backdrop-filter:blur(6px);
      transition:background .25s ease, transform .25s ease;
    }
    .skip-loader:hover{ background:rgba(255,255,255,.20); }
    .skip-loader:focus-visible{ outline:2px solid #64c778; outline-offset:3px; }
    .skip-loader:active{ transform:scale(.97); }

    @media (max-width:480px){
      .title-banner{ width: clamp(220px, 56vw, 420px); }
      :root{ --bar-h: 44px; }
    }
    @media (prefers-reduced-motion: reduce){
      .glass-bar .shine{ display:none; }
      .glass-bar .fill::after{ display:none; }
    }
  </style>

  <!-- اسکریپت تحلیل (فایل مشترک) - به‌صورت غیرمسدودکننده -->
  <!-- کارکرد: بارگذاری Clarity برای ردیابی تعاملات بدون بلوک رندر -->
  <script src="src/js/clarity.js" defer></script>
</head>
<body>
  <div class="page" aria-label="درگاه پرداخت">
    <!-- عنوان تصویری -->
    <!-- کارکرد: نمایش لوگوی تیتر صفحه -->
    <header class="top" aria-label="سرتیتر">
      <img class="title-banner" src="images/logo/title.webp" alt="درگاه پرداخت گروه جهادی بسیج شهدای سازمان تامین اجتماعی">
    </header>

    <!-- لودینگ Lottie + نوار شیشه‌ای + نسخه -->
    <!-- کارکرد: نمایش وضعیت آماده‌سازی و نسخه جاری -->
    <section class="loader" aria-live="polite" aria-busy="true">
      <dotlottie-player
        id="loaderAnim"
        src="images/logo/sandy-loading.lottie"
        autoplay
        loop
        speed="1"
      ></dotlottie-player>

      <div class="glass-bar" role="progressbar" aria-label="پیشرفت بارگذاری" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="fill"></div>
        <div class="shine"></div>
        <span class="text">در حال آماده‌سازی صفحه درگاه پرداخت…</span>
      </div>

      <!-- نسخه زیر لودینگ و بالای کپی‌رایت -->
      <div class="version" aria-label="نسخه">نسخه 7.0.0</div>

      <!-- دکمه ردشدن از صفحه لودینگ - دسترس‌پذیر با کیبورد -->
      <button type="button" id="skip-loader" class="skip-loader">ردشدن و ورود به درگاه ←</button>
    </section>
  </div>

  <!-- کپی‌رایت پایین صفحه با تبدیل ۴ ثانیه‌ای -->
  <!-- کارکرد: نمایش پیام انگلیسی سپس فارسی با افکت محوشدن -->
  <footer class="credits" aria-hidden="false">
    <div class="credits-inner">
      <span id="credit-en" class="credit credit-en">Commissioned by the Basij of the Social Security Organization</span>
      <span id="credit-fa" class="credit credit-fa">به سفارش و همت هیأت اندیشه‌ورز بسیج سازمان تأمین اجتماعی</span>
    </div>
  </footer>

  <!-- اسکریپت‌های صفحه (حفظ منطق موجود: انیمیشن نوار و هدایت به صفحه کارت‌ها) -->
  <script>
    "use strict";
    // نمایش کپی‌رایت: EN → FA پس از ۴ ثانیه
    // کارکرد: سوئیچ تدریجی بین دو متن کپی‌رایت
    const creditEN = document.getElementById("credit-en");
    const creditFA = document.getElementById("credit-fa");
    creditEN.classList.add("show");
    setTimeout(function(){ creditEN.classList.remove("show"); creditFA.classList.add("show"); }, 4000);

    // Skip-to-content guard: navigate only once, from timer or user action
    const NEXT_PAGE = "cards-form.html";
    let navigated = false;
    function goNext(){
      if (navigated) return;
      navigated = true;
      window.location.href = NEXT_PAGE;
    }
    document.getElementById("skip-loader").addEventListener("click", goNext);

    // همگام‌سازی کامل با یک زمان‌سنج واحد و easing نرم
    // کارکرد: انیمیشن پیشروی نوار شیشه‌ای با ARIA به‌روزشونده
    const bar = document.querySelector(".glass-bar");
    const start = performance.now();
    const DURATION = 2500; // ms — shortened splash for faster access to content

    // تابع ease نرم (cubic)
    const easeInOutCubic = (x) => (x < 0.5) ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;

    function raf(now){
      const t = Math.min(1, (now - start)/DURATION);  // 0..1
      const te = easeInOutCubic(t);
      const pct = Math.round(te*100);

      // بروزرسانی ARIA و متغیر CSS مشترک
      bar.setAttribute("aria-valuenow", pct);
      bar.style.setProperty('--p', (te*100).toFixed(2) + '%');

      if(t < 1){ requestAnimationFrame(raf); }
    }
    requestAnimationFrame(raf);

    // هدایت به فرم کارت‌ها پس از پایان
    // کارکرد: انتقال خودکار به صفحه اصلی انتخاب مسیر پرداخت
    setTimeout(goNext, DURATION);
  </script>
</body>
</html>
<!-- ساخته شده توسط مهدی باغبانپور بروجنی -->
