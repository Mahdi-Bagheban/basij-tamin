<!-- به نام خداوند بخشنده مهربان -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- سیاست امنیت محتوا؛ این صفحه هیچ اسکریپت یا استایل اینلاینی ندارد -->
  <!-- Strict Content-Security-Policy; this page carries no inline script or style -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self' https://*.clarity.ms; connect-src 'self' https://*.clarity.ms https://*.microsoft.com; frame-src https://*.clarity.ms">
  <meta name="theme-color" content="#1E5939" />
  <title>بررسی نیت خیر - بسیج تأمین اجتماعی</title>

  <!-- متا تگ‌های SEO -->
  <meta name="description" content="فرم انتخاب و بررسی نیت خیر گروه جهادی بسیج witnessed by سازمان تأمین اجتماعی">
  <meta name="author" content="گروه جهادی بسیج سازمان تأمین اجتماعی">
  <meta name="keywords" content="نیت خیر, بسیج, تأمین اجتماعی, خیریه, نذر">
  <meta property="og:title" content="بررسی نیت خیر - بسیج تأمین اجتماعی">
  <meta property="og:description" content="فرم انتخاب و بررسی نیت خیر">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:site_name" content="درگاه پرداخت groupe جهادی بسیج">
  <meta property="og:image:alt" content="درگاه پرداخت گروه جهادی بسیج witnessed by سازمان تأمین اجتماعی">
  <meta name="twitter:card" content="summary_large_image">

  <!-- پیوندهای سئو و آیکن - نشانی مبدأ در زمان دیپلوی به‌صورت خودکار جایگزین می‌شود -->
  <!-- SEO links; the __SITE_ORIGIN__ token is replaced with the real origin at deploy time -->
  <link rel="canonical" href="__SITE_ORIGIN__/payment-form.html" />
  <meta property="og:image" content="__SITE_ORIGIN__/images/logo/cards-page-title-desktop.webp" />
  <meta property="og:url" content="__SITE_ORIGIN__/payment-form.html" />
  <link rel="icon" href="images/logo/icon.webp" type="image/webp" />
  <!-- پیش‌بارگذاری فونت اصلی: زنجیرهٔ کشف HTML ← fonts.css ← woff2 را کوتاه و LCP را زودتر می‌کند -->
  <!-- Preload the primary font to shorten the HTML -> fonts.css -> woff2 discovery chain (LCP) -->
  <link rel="preload" href="fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="src/css/fonts.css" />
  <link rel="stylesheet" href="payment-styles.css" />
  <!-- Preconnect to the analytics origin to remove handshake latency from the critical path -->
  <link rel="preconnect" href="https://www.clarity.ms" crossorigin />

  <!-- اسکریپت تحلیل (فایل مشترک) - به‌صورت غیرمسدودکننده -->
  <!-- کارکرد: بارگذاری Clarity برای ردیابی تعاملات بدون بلوک رندر -->
  <script type="module" src="src/js/utils.js"></script>
  <script type="module" src="src/js/data.js"></script>
  <script type="module" src="src/js/data-niat.js"></script>
  <script type="module" src="payment-scripts.js"></script>
</head>

<body>
  <!-- لینک پرش به محتوا برای دسترس‌پذیری -->
  <a href="#payment-form" class="skip-link" aria-label="پرش به فرم پرداخت">پرش به فرم</a>

  <div class="pay-shell">
    <header class="pay-header">
      <h1 id="page-title">ثبت نیت خیر</h1>
    </header>

    <section class="glass form-container">
      <form id="payment-form" novalidate autocomplete="on">
        <div class="grid two">
          <div class="input-group">
            <label for="fullname">نام و نام خانوادگی</label>
            <div class="field-wrapper">
              <input id="fullname" name="fullname" type="text" placeholder="نام و نام خانوادگی" autocomplete="name"
                aria-describedby="fullname-error" required />
            </div>
            <small id="fullname-error" class="error" role="alert" aria-live="polite"></small>
          </div>

          <div class="input-group">
            <label for="mobile">شماره موبایل</label>
            <div class="field-wrapper">
<input id="mobile" name="mobile" type="tel" placeholder="09xxxxxxxxx" inputmode="numeric"
                 autocomplete="tel" maxlength="11" pattern="09[0-9]{9}" aria-describedby="mobile-error" required />
            </div>
            <small id="mobile-error" class="error" role="alert" aria-live="polite"></small>
          </div>
        </div>

        <div class="grid two">
          <div class="input-group">
            <label for="province">استان</label>
            <div class="field-wrapper">
              <select id="province" name="province" aria-describedby="province-error" required autocomplete="address-level1">
                <option value="" selected>استان را انتخاب کنید</option>
              </select>
            </div>
            <small id="province-error" class="error" role="alert" aria-live="polite"></small>
          </div>

          <div class="input-group">
            <label for="city">شهر</label>
            <div class="field-wrapper">
              <select id="city" name="city" aria-describedby="city-error" required disabled autocomplete="address-level2">
                <option value="" selected>ابتدا استان را انتخاب کنید</option>
              </select>
            </div>
            <small id="city-error" class="error" role="alert" aria-live="polite"></small>
          </div>
        </div>

        <hr class="divider" />

        <div class="intents-wrapper" id="intents-wrapper" aria-describedby="intent-error"></div>
        <p id="intent-error" class="error form-error" role="alert" aria-live="polite"></p>

        <section class="notes-section">
          <div class="input-group notes-block">
            <label class="visually-hidden" for="donation-notes">توضیحات اختیاری</label>
            <div class="field-wrapper">
              <textarea id="donation-notes" name="donation-notes" class="notes-textarea"
                placeholder="توضیحات اختیاری (حداکثر ۳۱۳ حرف) - باعث هدایت دقیق‌تر نیت خیر شما می‌شود" maxlength="313"
                aria-label="توضیحات اختیاری"></textarea>
              <span id="notes-inline-count" class="notes-counter pos-bl">۰/۳۱۳</span>
            </div>
          </div>
        </section>

        <div class="summary">
          <div class="total-line">
            <span>جمع مبلغ قابل پرداخت:</span>
            <strong id="grand-total">۰ تومان</strong>
          </div>

          <!-- ظرف مطلق دسته‌گل با ارتفاع کنترل‌شده -->
          <div id="bouquet" aria-label="دسته گل نرگس" role="img"></div>

          <div class="pay-actions">
            <button id="pay-btn" class="btn primary" type="submit">بررسی اطلاعات نیت</button>
          </div>
        </div>

        <div class="trust-footer">
          <div class="trust-logos">
            <img src="images/logo/enamad.webp" width="500" height="425" alt="اینماد" loading="lazy" />
            <img src="images/logo/samandehi.webp" width="500" height="444" alt="ساماندهی" loading="lazy" />
            <img src="images/logo/shaparak.webp" width="500" height="340" alt="شاپرک" loading="lazy" />
          </div>
          <div class="brand-title"><i class="brand-mask" aria-hidden="true"></i></div>
        </div>

        <div class="credit-inline" role="contentinfo" aria-live="polite">
          <span class="line en" dir="ltr">Commissioned by the Basij of the Social Security Organization</span>
          <span class="line fa" dir="rtl">به سفارش و همت هیأت اندیشه‌ورز بسیج سازمان تأمین اجتماعی</span>
        </div>
      </form>
    </section>
  </div>

  <div class="modal" id="thank-modal" role="dialog" aria-modal="true" aria-labelledby="thank-title" aria-describedby="thank-message">
    <div class="modal-content thank-decor">
      <h2 id="thank-title">اطلاعات نیت بررسی شد</h2>
      <p id="thank-message">اتصال به درگاه بانکی در این نسخه فعال نیست؛ هیچ تراکنشی ثبت یا ارسال نشده است.</p>
      <div class="modal-actions">
        <button class="btn primary" id="redirect-btn" type="button">بازگشت به انتخاب نیت</button>
        <button class="btn" id="modal-close" type="button">بستن</button>
      </div>
    </div>
  </div>

  <!-- اسکریپت‌ها -->
  <script type="module" src="src/js/utils.js"></script>
  <script type="module" src="src/js/data.js"></script>
  <script type="module" src="src/js/data-niat.js"></script>
  <script type="module" src="payment-scripts.js"></script>
</body>

</html>
<!-- ساخته شده توسط مهدی باغبانپور بروجنی -->
