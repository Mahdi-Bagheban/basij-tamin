<!-- به نام خداوند بخشنده مهربان -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1E5939" />
  <title>درگاه ثبت خیر - بسیج تأمین اجتماعی</title>

  <!-- متا تگ‌های SEO -->
  <meta name="description" content="فرم ثبت پرداخت نیت خیر - درگاه گروه جهادی بسیج شهدای سازمان تأمین اجتماعی">
  <meta name="author" content="گروه جهادی بسیج سازمان تأمین اجتماعی">
  <meta name="keywords" content="پرداخت آنلاین, نیت خیر, بسیج, تأمین اجتماعی, خیریه">
  <meta property="og:title" content="ثبت نیت خیر - درگاه پرداخت بسیج">
  <meta property="og:description" content="فرم ثبت پرداخت نیت خیر به صورت آنلاین">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fa_IR">

  <!-- پیوندهای سئو و آیکن - نشانی مبدأ در زمان دیپلوی به‌صورت خودکار جایگزین می‌شود -->
  <!-- SEO links; the __SITE_ORIGIN__ token is replaced with the real origin at deploy time -->
  <link rel="canonical" href="__SITE_ORIGIN__/payment-form.html" />
  <meta property="og:image" content="__SITE_ORIGIN__/images/logo/cards-page-title-desktop.webp" />
  <meta property="og:url" content="__SITE_ORIGIN__/payment-form.html" />
  <link rel="icon" href="images/logo/icon.webp" type="image/webp" />
  <link rel="stylesheet" href="src/css/fonts.css" />
  <link rel="stylesheet" href="payment-styles.css" />
  <!-- اسکریپت تحلیل (فایل مشترک) - به‌صورت غیرمسدودکننده -->
  <!-- Analytics shared script, deferred to avoid render blocking -->
  <script src="src/js/clarity.js" defer></script>
</head>

<body>
  <!-- لینک پرش به محتوا برای دسترس‌پذیری -->
  <a href="#payment-form" class="skip-link" aria-label="پرش به فرم پرداخت">پرش به فرم</a>

  <div class="pay-shell">
    <header class="pay-header">
      <h1 id="page-title">ثبت نیت خیر</h1>
    </header>

    <section class="glass form-container">
      <form id="payment-form" novalidate>
        <div class="grid two">
          <div class="input-group">
            <label for="fullname">نام و نام خانوادگی</label>
            <div class="field-wrapper">
              <input id="fullname" name="fullname" type="text" placeholder="نام و نام خانوادگی" autocomplete="name"
                required />
            </div>
            <small class="error"></small>
          </div>

          <div class="input-group">
            <label for="mobile">شماره موبایل</label>
            <div class="field-wrapper">
              <input id="mobile" name="mobile" type="tel" placeholder="09xxxxxxxxx" inputmode="numeric"
                autocomplete="tel" required />
            </div>
            <small class="error"></small>
          </div>
        </div>

        <div class="grid two">
          <div class="input-group">
            <label for="province">استان</label>
            <div class="field-wrapper">
              <select id="province" name="province" required>
                <option value="" selected>استان را انتخاب کنید</option>
              </select>
            </div>
            <small class="error"></small>
          </div>

          <div class="input-group">
            <label for="city">شهر</label>
            <div class="field-wrapper">
              <select id="city" name="city" required disabled>
                <option value="" selected>ابتدا استان را انتخاب کنید</option>
              </select>
            </div>
            <small class="error"></small>
          </div>
        </div>

        <hr class="divider" />

        <div class="intents-wrapper" id="intents-wrapper"></div>

        <section class="notes-section">
          <div class="input-group notes-block">
            <label for="donation-notes"></label>
            <div class="field-wrapper">
              <textarea id="donation-notes" name="donation-notes" class="notes-textarea"
                placeholder="توضیحات اختیاری (حداکثر ۳۱۳ حرف) - باعث هدایت دقیق‌تر نیت خیر شما می‌شود" maxlength="313"
                aria-label="توضیحات اختیاری"></textarea>
              <span id="notes-inline-count" class="notes-counter pos-bl">۰/۳۱۳</span>
            </div>
          </div>
        </section>

        <div class="summary">
          <div class="total-line">
            <span>جمع مبلغ قابل پرداخت:</span>
            <strong id="grand-total">۰ تومان</strong>
          </div>

          <!-- ظرف مطلق دسته‌گل با ارتفاع کنترل‌شده -->
          <div id="bouquet" aria-label="دسته گل نرگس" role="img"></div>

          <div class="pay-actions">
            <button id="pay-btn" class="btn primary" type="submit">با نام خدا پرداخت میکنم</button>
          </div>
        </div>
      </form>

      <div class="trust-footer">
        <div class="trust-logos">
          <img src="images/logo/enamad.webp" alt="اینماد" />
          <img src="images/logo/samandehi.webp" alt="ساماندهی" />
          <img src="images/logo/shaparak.webp" alt="شاپرک" />
        </div>
        <div class="brand-title"><i class="brand-mask" aria-hidden="true"></i></div>
      </div>

      <div class="credit-inline" role="contentinfo" aria-live="polite">
        <span class="line en" dir="ltr">Commissioned by the Basij of the Social Security Organization</span>
        <span class="line fa" dir="rtl">به سفارش و همت هیأت اندیشه‌ورز بسیج سازمان تأمین اجتماعی</span>
      </div>
    </section>
  </div>

  <div class="modal" id="thank-modal" role="dialog" aria-modal="true" aria-labelledby="thank-title">
    <div class="modal-content thank-decor">
      <h3 id="thank-title">سپاس از نیت ارزشمند شما</h3>
      <p id="thank-message">هدایت به درگاه بانکی</p>
      <button class="btn primary" id="redirect-btn" type="button">انتقال به درگاه بانکی</button>
    </div>
  </div>

  <script src="src/js/utils.js"></script>
  <script src="src/js/data.js"></script>
  <script src="payment-scripts.js"></script>
</body>

</html>
<!-- ساخته شده توسط مهدی باغبانپور بروجنی -->
