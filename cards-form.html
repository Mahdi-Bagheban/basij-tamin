<!-- به نام خداوند بخشنده مهربان -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- عنوان و نسخه صفحه کارت‌ها -->
  <title>درگاه پرداخت گروه جهادی - نیات خیر (6.7.5)</title>

  <!-- آیکن و استایل صفحه کارت‌ها -->
  <!-- کارکرد: بارگذاری آیکن و فایل CSS اختصاصی کارت‌ها -->
  <link rel="icon" href="images/logo/icon.webp" type="image/webp" />
  <link rel="stylesheet" href="cards-styles.css" />

  <!-- اسکریپت تحلیل -->
  <!-- کارکرد: بارگذاری Clarity برای ردیابی تعاملات - بدون تغییر منطقی -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        var h=(l.location&&l.location.hostname)||c.location.hostname;
        var isLocal=(c.location.protocol!=='https:')||/^(localhost|127\.0\.0\.1)$/i.test(h);
        if(isLocal){ c[a]=c[a]||function(){}; return; }
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "ta5vnt8v6q");
  </script>
</head>
<body>
  <!-- پس‌زمینه گرادیانی روز/شب -->
  <!-- کارکرد: دو لایه برای تغییر تدریجی تم با سوییچ روز/شب -->
  <div class="theme-bg" aria-hidden="true">
    <i class="layer day"></i>
    <i class="layer night"></i>
  </div>

  <!-- لایه تزئینی ثابت زیر کارت‌ها -->
  <!-- کارکرد: تصویر زمینه ثابت که پس از اتمام توالی ورود کارت‌ها ظاهر می‌شود -->
  <div class="cards-bg-fixed" aria-hidden="true"></div>

  <!-- ظرف افکت «بارش لوگو» (در حالت بسته پنل) -->
  <!-- کارکرد: افکت دعوت‌کننده قبل از بازشدن کارت‌ها -->
  <div id="logo-rain" aria-hidden="true"></div>

  <!-- سربرگ و دکمه باز/بسته پنل کارت‌ها -->
  <!-- کارکرد: با کلیک، پنل کارت‌ها باز/بسته و انیمیشن‌ها مدیریت می‌شود -->
  <header class="header-bar" role="banner">
    <button id="gateway-trigger" class="title-button" aria-controls="gateway-panel" aria-expanded="false">
      <div class="title-frame">
        <picture class="title-picture">
          <source srcset="images/logo/cards-page-title-mobile.webp" media="(max-width:650px)" />
          <img src="images/logo/cards-page-title-desktop.webp" alt="درگاه پرداخت گروه جهادی بسیج شهدای سازمان تامین اجتماعی" />
        </picture>
      </div>
    </button>
  </header>

  <!-- کنترل‌های دسکتاپ: تغییر نمای کارت‌ها -->
  <!-- کارکرد: دکمه‌های کوچک/بزرگ برای تغییر چیدمان شبکه کارت‌ها -->
  <div id="desktop-controls-left" class="desktop-fixed controls-fade hide" aria-label="نمای کارت‌ها">
    <div class="view-switcher">
      <button type="button" data-view="small" aria-pressed="true" aria-label="نمای کوچک" data-tooltip="نمای کوچک">
        <span class="png-icon"><img src="images/logo/medium-cards.png" alt="کوچک" /></span>
      </button>
      <button type="button" data-view="big" aria-pressed="false" aria-label="نمای بزرگ" data-tooltip="نمای بزرگ">
        <span class="png-icon"><img src="images/logo/large-cards.png" alt="بزرگ" /></span>
      </button>
    </div>
  </div>

  <!-- کنترل‌های دسکتاپ: تغییر حالت روز/شب -->
  <!-- کارکرد: سوییچ تم برای پس‌زمینه و رنگ‌ها -->
  <div id="desktop-controls-right" class="desktop-fixed controls-fade hide" aria-label="حالت روز/شب">
    <div class="day-night-switcher">
      <button type="button" data-mode="day" aria-pressed="true" aria-label="حالت روز" data-tooltip="روز">
        <span class="png-icon"><img src="images/logo/sun.png" alt="روز" /></span>
      </button>
      <button type="button" data-mode="night" aria-pressed="false" aria-label="حالت شب" data-tooltip="شب">
        <span class="png-icon"><img src="images/logo/moon.png" alt="شب" /></span>
      </button>
    </div>
  </div>

  <!-- پنل کارت‌ها: در آغاز بسته است و با دکمه باز می‌شود -->
  <!-- کارکرد: شامل ردیف کنترل‌های موبایل و گرید کارت‌ها -->
  <main id="gateway-panel" class="gateway-panel collapsed" role="region" aria-label="فهرست کارت‌ها">
    <section class="cards-bg-green">
      <!-- کنترل‌های موبایل: نمای کارت‌ها + حالت -->
      <!-- کارکرد: ظاهر شدن فقط روی موبایل به‌جای کنترل‌های ثابت دسکتاپ -->
      <div id="mobile-controls" class="controls-row controls-fade hide" aria-label="کنترل‌های صفحه">
        <div class="view-switcher" role="group" aria-label="نمای کارت‌ها">
          <button type="button" data-view="small" aria-pressed="true" aria-label="نمای کوچک" data-tooltip="نمای کوچک">
            <span class="png-icon"><img src="images/logo/medium-cards.png" alt="کوچک" /></span>
          </button>
          <button type="button" data-view="big" aria-pressed="false" aria-label="نمای بزرگ" data-tooltip="نمای بزرگ">
            <span class="png-icon"><img src="images/logo/large-cards.png" alt="بزرگ" /></span>
          </button>
        </div>
        <div class="day-night-switcher" role="group" aria-label="حالت">
          <button type="button" data-mode="day" aria-pressed="true" aria-label="حالت روز" data-tooltip="روز">
            <span class="png-icon"><img src="images/logo/sun.png" alt="روز" /></span>
          </button>
          <button type="button" data-mode="night" aria-pressed="false" aria-label="حالت شب" data-tooltip="شب">
            <span class="png-icon"><img src="images/logo/moon.png" alt="شب" /></span>
          </button>
        </div>
      </div>

      <!-- گرید کارت‌ها -->
      <!-- کارکرد: هر کارت یا منوی چندسطحی (data-menu) دارد یا لینک مستقیم (data-url) -->
      <div class="cards-container view-small" id="cards-container">
        <!-- 1: قلک بیمه (لینک مستقیم) -->
        <!-- کارکرد: هدایت با cause برای هم‌راستایی با payment-form -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-url="payment-form.html?cause=قلک_بیمه">
            <span class="basij-flash"></span>
            <img loading="lazy" src="images/cards/card-01.webp" alt="قلک بیمه" onerror="this.onerror=null;this.src='images/cards/fallback.webp';this.classList.add('missing')" />
            <div class="card-overlay"><div class="card-title">قلک بیمه</div></div>
          </article>
        </div>

        <!-- 2: نذر درمانی (منوی چندسطحی) -->
        <!-- کارکرد: به‌روزرسانی ساختار مطابق ترتیب جدید «تجهیزات درمان» + «دارو» -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-menu='[
            {"title":"تجهیزات درمان","submenu":[
              {"title":"دستگاه دیالیز","url":"payment-form.html?cause=نذر_درمانی_تجهیزات_درمان_دستگاه_دیالیز"},
              {"title":"جراحی چشم","url":"payment-form.html?cause=نذر_درمانی_تجهیزات_درمان_جراحی_چشم"},
              {"title":"اکو قلب","url":"payment-form.html?cause=نذر_درمانی_تجهیزات_درمان_اکو_قلب"},
              {"title":"سونوگرافی","url":"payment-form.html?cause=نذر_درمانی_تجهیزات_درمان_سونوگرافی"},
              {"title":"سونوگرافی تخصصی","url":"payment-form.html?cause=نذر_درمانی_تجهیزات_درمان_سونوگرافی_تخصصی"},
              {"title":"ماموگرافی","url":"payment-form.html?cause=نذر_درمانی_تجهیزات_درمان_ماموگرافی"},
              {"title":"تجهیزات آزمایشگاه بیوشیمی","url":"payment-form.html?cause=نذر_درمانی_تجهیزات_درمان_تجهیزات_آزمایشگاه_بیوشیمی"},
              {"title":"شمارشگر خون","url":"payment-form.html?cause=نذر_درمانی_تجهیزات_درمان_شمارشگر_خون"},
              {"title":"دستگاه گاز خون","url":"payment-form.html?cause=نذر_درمانی_تجهیزات_درمان_دستگاه_گاز_خون"},
              {"title":"لنز و تجهیزات چشم","url":"payment-form.html?cause=نذر_درمانی_تجهیزات_درمان_لنز_و_تجهیزات_چشم"},
              {"title":"پروتزهای مفصل","url":"payment-form.html?cause=نذر_درمانی_تجهیزات_درمان_پروتزهای_مفصل"},
              {"title":"پروتز ستون فقرات","url":"payment-form.html?cause=نذر_درمانی_تجهیزات_درمان_پروتز_ستون_فقرات"}
            ]},
            {"title":"دارو","url":"payment-form.html?cause=نذر_درمانی_دارو"}
          ]'>
            <span class="basij-flash"></span>
            <img loading="lazy" src="images/cards/card-02.webp" alt="نذر درمانی" onerror="this.onerror=null;this.src='images/cards/fallback.webp';this.classList.add('missing')" />
            <div class="card-overlay"><div class="card-title">نذر درمانی</div></div>
          </article>
        </div>

        <!-- 3: نذر سازندگی (منوی ساده) -->
        <!-- کارکرد: آیتم‌های ساخت مراکز درمانی/بیمه‌ای/همراه‌سرا -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-menu='[
            {"title":"ساخت مراکز درمانی","url":"payment-form.html?cause=نذر_سازندگی_ساخت_مراکز_درمانی"},
            {"title":"ساخت مراکز بیمه‌ای","url":"payment-form.html?cause=نذر_سازندگی_ساخت_مراکز_بیمه‌ای"},
            {"title":"ساخت همراه‌سرا","url":"payment-form.html?cause=نذر_سازندگی_ساخت_همراه‌سرا"}
          ]'>
            <span class="basij-flash"></span>
            <img loading="lazy" src="images/cards/card-03.webp" alt="نذر سازندگی" onerror="this.onerror=null;this.src='images/cards/fallback.webp';this.classList.add('missing')" />
            <div class="card-overlay"><div class="card-title">نذر سازندگی</div></div>
          </article>
        </div>

        <!-- 4: نذر نان (لینک مستقیم) -->
        <!-- کارکرد: مسیر مستقیم با cause -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-url="payment-form.html?cause=نذر_نان">
            <span class="basij-flash"></span>
            <img loading="lazy" src="images/cards/card-04.webp" alt="نذر نان" onerror="this.onerror=null;this.src='images/cards/fallback.webp';this.classList.add('missing')" />
            <div class="card-overlay"><div class="card-title">نذر نان</div></div>
          </article>
        </div>

        <!-- 5: مواکب شهدای بسیج (منوی ساده) -->
        <!-- کارکرد: سه آیتم موکب -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-menu='[
            {"title":"موکب کربلا","url":"payment-form.html?cause=مواکب_شهدای_بسیج_موکب_کربلا"},
            {"title":"مواکب سراسر کشور","url":"payment-form.html?cause=مواکب_شهدای_بسیج_مواکب_سراسر_کشور"},
            {"title":"چایخانه حضرت رضا (ع)","url":"payment-form.html?cause=مواکب_شهدای_بسیج_چایخانه_حضرت_رضا"}
          ]'>
            <span class="basij-flash"></span>
            <img loading="lazy" src="images/cards/card-05.webp" alt="مواکب شهدای بسیج" onerror="this.onerror=null;this.src='images/cards/fallback.webp';this.classList.add('missing')" />
            <div class="card-overlay"><div class="card-title">مواکب شهدای بسیج</div></div>
          </article>
        </div>

        <!-- 6: نذر قربانی (لینک مستقیم) -->
        <!-- کارکرد: مسیر مستقیم با cause -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-url="payment-form.html?cause=نذر_قربانی">
            <span class="basij-flash"></span>
            <img loading="lazy" src="images/cards/card-06.webp" alt="نذر قربانی" onerror="this.onerror=null;this.src='images/cards/fallback.webp';this.classList.add('missing')" />
            <div class="card-overlay"><div class="card-title">نذر قربانی</div></div>
          </article>
        </div>

        <!-- 7: کمک معیشتی و نذر مؤمنانه (منوی ساده) -->
        <!-- کارکرد: انتقال «کمک به جبهه مقاومت» به این منو؛ حذف آیتم قدیم زندانیان -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-menu='[
            {"title":"نذر فرهنگی","url":"payment-form.html?cause=کمک_معیشتی_و_نذر_مؤمنانه_نذر_فرهنگی"},
            {"title":"کمک به خرید جهیزیه","url":"payment-form.html?cause=کمک_معیشتی_و_نذر_مؤمنانه_کمک_به_خرید_جهیزیه"},
            {"title":"کمک هزینه ازدواج","url":"payment-form.html?cause=کمک_معیشتی_و_نذر_مؤمنانه_کمک_هزینه_ازدواج"},
            {"title":"کمک به جبهه مقاومت","url":"payment-form.html?cause=کمک_معیشتی_و_نذر_مؤمنانه_کمک_به_جبهه_مقاومت"}
          ]'>
            <span class="basij-flash"></span>
            <img loading="lazy" src="images/cards/card-07.webp" alt="کمک معیشتی و نذر مؤمنانه" onerror="this.onerror=null;this.src='images/cards/fallback.webp';this.classList.add('missing')" />
            <div class="card-overlay"><div class="card-title">کمک معیشتی و نذر مؤمنانه</div></div>
          </article>
        </div>

        <!-- 8: وجوهات شرعی (منوی چندسطحی) -->
        <!-- کارکرد: منوی تو در تو برای خمس/کفاره/فطریه + موارد مستقل -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-menu='[
            {"title":"خمس","submenu":[
              {"title":"خمس عام","url":"payment-form.html?cause=وجوهات_شرعی_خمس_عام"},
              {"title":"خمس سادات","url":"payment-form.html?cause=وجوهات_شرعی_خمس_سادات"}
            ]},
            {"title":"کفاره","submenu":[
              {"title":"کفاره عام","url":"payment-form.html?cause=وجوهات_شرعی_کفاره_عام"},
              {"title":"کفاره سادات","url":"payment-form.html?cause=وجوهات_شرعی_کفاره_سادات"}
            ]},
            {"title":"فطریه","submenu":[
              {"title":"فطریه عام","url":"payment-form.html?cause=وجوهات_شرعی_فطریه_عام"},
              {"title":"فطریه سادات","url":"payment-form.html?cause=وجوهات_شرعی_فطریه_سادات"}
            ]},
            {"title":"خیرات اموات","url":"payment-form.html?cause=وجوهات_شرعی_خیرات_اموات"},
            {"title":"ثلث مال","url":"payment-form.html?cause=وجوهات_شرعی_ثلث_مال"},
            {"title":"رد مظالم","url":"payment-form.html?cause=وجوهات_شرعی_رد_مظالم"},
            {"title":"صدقه","url":"payment-form.html?cause=وجوهات_شرعی_صدقه"}
          ]'>
            <span class="basij-flash"></span>
            <img loading="lazy" src="images/cards/card-08.webp" alt="وجوهات شرعی" onerror="this.onerror=null;this.src='images/cards/fallback.webp';this.classList.add('missing')" />
            <div class="card-overlay"><div class="card-title">وجوهات شرعی</div></div>
          </article>
        </div>

        <!-- 9: آزادی زندانیان غیرعمد (کارت مستقل جایگزین کارت قبلی) -->
        <!-- کارکرد: کارت جدید مستقل با لینک مستقیم -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-url="payment-form.html?cause=آزادی_زندانیان_غیرعمد">
            <span class="basij-flash"></span>
            <img loading="lazy" src="images/cards/card-09.webp" alt="آزادی زندانیان غیرعمد" onerror="this.onerror=null;this.src='images/cards/fallback.webp';this.classList.add('missing')" />
            <div class="card-overlay"><div class="card-title">آزادی زندانیان غیرعمد</div></div>
          </article>
        </div>

        <!-- 10: نذر عام (لینک مستقیم) -->
        <!-- کارکرد: مسیر مستقیم با cause -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-url="payment-form.html?cause=نذر_عام">
            <span class="basij-flash"></span>
            <img loading="lazy" src="images/cards/card-10.webp" alt="نذر عام" onerror="this.onerror=null;this.src='images/cards/fallback.webp';this.classList.add('missing')" />
            <div class="card-overlay"><div class="card-title">نذر عام</div></div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <!-- باند گرادیانی و کپیرایت پایین صفحه -->
  <!-- کارکرد: نمایش متناوب پیام انگلیسی/فارسی با انیمیشن آهسته -->
  <div class="credit-band" aria-hidden="true"></div>
  <div class="credit" id="credit" role="note" aria-live="polite">
    <span class="credit-line en" dir="ltr">Commissioned by the Basij of the Social Security Organization</span>
    <span class="credit-line fa" dir="rtl">به سفارش و همت هیأت اندیشه‌ورز بسیج سازمان تأمین اجتماعی</span>
  </div>

  <!-- اسکریپت‌های صفحه کارت‌ها -->
  <!-- کارکرد: مدیریت افکت‌ها، کنترل‌ها، منوهای چندسطحی و کلیک کارت‌ها -->
  <script src="cards-scripts.js"></script>
</body>
</html>
<!-- ساخته شده توسط مهدی باغبانپور بروجنی -->
