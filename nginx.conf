# درگاه پرداخت گروه جهادی بسیج — پیکربندی سرویس‌دهنده برای خود-میزبانی
# پورت سرویس: 8080 (مناسب برای داکر) — با معکوس‌ساز پورت، 443 را به آن وصل کنید
# ---
# Basij payment portal — nginx configuration for self-hosting
# Listens on port 8080 (Docker-friendly); put a TLS-terminating reverse proxy in front

server {
    listen 8080;
    server_name _;

    # ریشهٔ سایت با صفحهٔ آغاز و خطای برندسازی‌شده
    # Site root with index page and branded 404
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # هدرهای امنیتی - برای دامنهٔ واقعی خود جایگزین کنید
    # Security headers — replace example origin with your real domain
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # سیاست امنیت محتوا - قبل از فعال‌سازی، در کنسول مرورگر با تمام صفحات راستی‌آزمایی شود
    # Content-Security-Policy — verify against every page in the browser console before enabling
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.clarity.ms https://*.microsoft.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # کش دارایی‌های ایستا — فونت و تصاویر تغییر نام نمی‌دهند؛ ونیل با اثر انگشت فایل
    # Static asset caching — fonts/images are immutable; vendor files are content-fingerprinted
    location ~* \.(woff2?|webp|png|svg|lottie)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location /assets/vendor/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # صفحات اصلی همیشه تازه بازبینی شوند
    # Main pages are always revalidated
    location ~* \.(html|xml|txt)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
